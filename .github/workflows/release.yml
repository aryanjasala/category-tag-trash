name: Release

# Publishes a release whenever main carries a version that has no tag yet,
# normally right after the release pull request (prepare-release.yml) is
# merged: tags vX.Y.Z, builds the zip and creates the GitHub release with the
# readme.txt changelog entry as notes.
#
# Deploying to WordPress.org as well needs the repository variable
# WPORG_DEPLOY=true and the secrets SVN_USERNAME and SVN_PASSWORD.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Is this version released yet?
        id: version
        run: |
          version="$(bin/release.sh check)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released, nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$version."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: shivammathur/setup-php@v2
        if: steps.version.outputs.release == 'true'
        with:
          php-version: '8.3'
          coverage: none

      - uses: ramsey/composer-install@v4
        if: steps.version.outputs.release == 'true'

      - name: Lint and unit test before releasing
        if: steps.version.outputs.release == 'true'
        run: |
          vendor/bin/phpcs -q
          vendor/bin/phpunit

      - name: Build the zip and release notes
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bin/build-zip.sh
          awk -v heading="= $VERSION =" '$0 == heading { found = 1; next } /^= / { found = 0 } found' readme.txt > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish the release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" "dist/term-trash.zip" \
            --target "$GITHUB_SHA" \
            --title "Term Trash $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"

  wordpress-org:
    name: Deploy to WordPress.org
    needs: release
    if: needs.release.outputs.released == 'true' && vars.WPORG_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: 10up/action-wordpress-plugin-deploy@2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: term-trash
          VERSION: ${{ needs.release.outputs.version }}
