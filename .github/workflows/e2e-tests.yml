name: E2E tests

on:
  push:
    branches: [main]
  pull_request:
  # Lets the release workflow run these checks on its own pull request.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (WordPress latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install Playwright
        run: npm ci

      - name: Start WordPress
        run: npm run env:start

      - name: Run end-to-end tests
        run: npm run test:e2e
        env:
          # GitHub's Ubuntu runners ship Google Chrome, so no browser download is needed.
          PW_CHANNEL: chrome

      - name: WordPress debug log
        if: failure()
        run: docker compose -f tests/e2e/env/docker-compose.yml exec -T wp cat /var/www/html/wp-content/debug.log || true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
